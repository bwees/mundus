[tools]
go = "1.27.0"
node = "24"
pnpm = "11"

[env]
DEVICE = "wlab@192.168.30.148"
DEVICE_DIR = "/opt/wlab/sweepbot/mundus"

[tasks.install]
description = "Install web dependencies"
dir = "web"
run = "pnpm install"

[tasks.zip]
description = "Build the mundus installer USB zip (needs `mise run dist` first)"
run = "./usb/build-zip.sh --bin dist/mundus --web web/build --out dist/develop-tools-mundus.zip"

[tasks.openapi]
description = "Regenerate server openapi.json and the typed web client"
run = [
  "cd server && go run . -openapi",
  "cd web && pnpm run openapi:generate",
]

[tasks.dev]
description = "Run the web UI in dev mode (proxies /api to :8080)"
dir = "web"
run = "pnpm run dev"

[tasks.web-build]
description = "Build the static web UI"
dir = "web"
run = "pnpm run build"

[tasks.build]
description = "Cross-compile the mundus server for the device (linux/arm64)"
run = "cd server && GOOS=linux GOARCH=arm64 go build -o ../dist/mundus ."

[tasks.dist]
description = "Build server binary + web bundle into dist/"
depends = ["build", "web-build"]
run = "rm -rf dist/web && cp -r web/build dist/web"

[tasks.deploy]
description = "Build everything and deploy binary + web to the device"
depends = ["dist"]
run = [
  "ssh $DEVICE 'sudo mkdir -p $DEVICE_DIR/web && sudo chown -R wlab $DEVICE_DIR'",
  # Staged then renamed: Linux refuses to open a running executable for writing,
  # so writing straight to $DEVICE_DIR/mundus fails with ETXTBSY.
  "ssh $DEVICE 'cat > $DEVICE_DIR/mundus.new && chmod +x $DEVICE_DIR/mundus.new' < dist/mundus",
  "tar -C dist/web -czf - . | ssh $DEVICE 'rm -rf $DEVICE_DIR/web.new && mkdir -p $DEVICE_DIR/web.new && tar -C $DEVICE_DIR/web.new -xzf -'",
  "ssh $DEVICE 'set -e; D=$DEVICE_DIR; pkill -f \"$D/mundus\" || true; sleep 2; mv $D/mundus.new $D/mundus; rm -rf $D/web.old; [ -d $D/web ] && mv $D/web $D/web.old; mv $D/web.new $D/web; setsid $D/mundus -config $D/mundus.json </dev/null >>$D/mundus.log 2>&1 & sleep 5; pgrep -f \"$D/mundus -config\" >/dev/null && echo deployed && exit 0; echo FAILED; tail -20 $D/mundus.log; exit 1'",
]
